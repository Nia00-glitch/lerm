<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="l4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="l3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.8" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="680" />
    <line x1="250" y1="0" x2="250" y2="680" />
    <line x1="400" y1="0" x2="400" y2="680" />
    <line x1="550" y1="0" x2="550" y2="680" />
    <line x1="700" y1="0" x2="700" y2="680" />
    <line x1="850" y1="0" x2="850" y2="680" />
  </g>

  <!-- Title & Metadata -->
  <text x="50" y="50" fill="#f8fafc" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="0.5">LERM — SYSTEM ARCHITECTURE</text>
  <text x="50" y="75" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Layered Causal Control Plane &amp; Isolated Execution Fabric</text>
  
  <rect x="790" y="32" width="160" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <circle cx="806" cy="46" r="4" fill="#10b981" filter="url(#glowCyan)" />
  <text x="818" y="50" fill="#cbd5e1" font-size="11" font-family="monospace">P0/P1 VERIFIED</text>

  <!-- LAYER 4: SCIENTIFIC GOVERNANCE & SKEPTIC (Z=120) -->
  <g transform="translate(140, 110)">
    <!-- Isometric Slab -->
    <polygon points="120,0 720,0 600,100 0,100" fill="url(#l4Grad)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#dropShadow)" />
    <text x="30" y="30" fill="#d8b4fe" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">LAYER 4: ADVERSARIAL SKEPTIC &amp; GOVERNANCE (L0)</text>
    
    <!-- Node: Skeptic Attack Engine -->
    <g transform="translate(50, 42)">
      <rect width="160" height="42" rx="6" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Skeptic 5-Attack Engine</text>
      <text x="12" y="35" fill="#a855f7" font-size="9" font-family="monospace">Fresh Seeds / Confound Hunt</text>
    </g>

    <!-- Node: Knowledge Base & Settlement -->
    <g transform="translate(240, 42)">
      <rect width="170" height="42" rx="6" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Knowledge Base (KB)</text>
      <text x="12" y="35" fill="#c084fc" font-size="9" font-family="monospace">Negative Results Registry</text>
    </g>

    <!-- Node: Spend & Drift Guardrails -->
    <g transform="translate(440, 42)">
      <rect width="160" height="42" rx="6" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Guardrails &amp; Kill-Switch</text>
      <text x="12" y="35" fill="#e879f9" font-size="9" font-family="monospace">Spend Cap &amp; Model Drift</text>
    </g>
  </g>

  <!-- Vertical Bus 4 -> 3 -->
  <path d="M 460 210 L 460 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3" />
  <polygon points="457,238 460,246 463,238" fill="#a855f7" />

  <!-- LAYER 3: CAUSAL CONTROL PLANE & FIREWALL (Z=80) -->
  <g transform="translate(140, 240)">
    <polygon points="120,0 720,0 600,100 0,100" fill="url(#l3Grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="30" y="30" fill="#7dd3fc" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">LAYER 3: CAUSAL CONTROL PLANE &amp; DATA FIREWALL</text>

    <!-- Node: Preregistration Ledger -->
    <g transform="translate(40, 42)">
      <rect width="160" height="42" rx="6" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Preregistration Hash</text>
      <text x="12" y="35" fill="#38bdf8" font-size="9" font-family="monospace">Sealed Before Execution</text>
    </g>

    <!-- Node: Fail-Closed Data Firewall -->
    <g transform="translate(230, 42)">
      <rect width="170" height="42" rx="6" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Fail-Closed Firewall</text>
      <text x="12" y="35" fill="#0284c7" font-size="9" font-family="monospace">HOLDOUT Quarantined</text>
    </g>

    <!-- Node: Deterministic Controller -->
    <g transform="translate(430, 42)">
      <rect width="170" height="42" rx="6" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Loop Controller</text>
      <text x="12" y="35" fill="#60a5fa" font-size="9" font-family="monospace">Retry vs Verify Matching</text>
    </g>
  </g>

  <!-- Vertical Bus 3 -> 2 -->
  <path d="M 460 340 L 460 370" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  <polygon points="457,368 460,376 463,368" fill="#38bdf8" />

  <!-- LAYER 2: TELEMETRY & CONFOUND AUDITING (Z=40) -->
  <g transform="translate(140, 370)">
    <polygon points="120,0 720,0 600,100 0,100" fill="url(#l2Grad)" stroke="#34d399" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="30" y="30" fill="#6ee7b7" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">LAYER 2: L1 TRACE LAYER &amp; CONFOUND AUDITOR</text>

    <!-- Node: L1 Trace Store -->
    <g transform="translate(40, 42)">
      <rect width="160" height="42" rx="6" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">L1 Immutable Traces</text>
      <text x="12" y="35" fill="#34d399" font-size="9" font-family="monospace">JSONL Event Steams</text>
    </g>

    <!-- Node: 10-Dimension Confound Audit -->
    <g transform="translate(230, 42)">
      <rect width="180" height="42" rx="6" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">10-Confound Checklist</text>
      <text x="12" y="35" fill="#10b981" font-size="9" font-family="monospace">Tokens / Clock / Drift Balance</text>
    </g>

    <!-- Node: Pass^k Unbiased Estimator -->
    <g transform="translate(440, 42)">
      <rect width="160" height="42" rx="6" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Pass^k Reliability Engine</text>
      <text x="12" y="35" fill="#059669" font-size="9" font-family="monospace">k &gt;= 5 Strict Consensus</text>
    </g>
  </g>

  <!-- Vertical Bus 2 -> 1 -->
  <path d="M 460 470 L 460 500" stroke="#34d399" stroke-width="2" stroke-dasharray="3,3" />
  <polygon points="457,498 460,506 463,498" fill="#34d399" />

  <!-- LAYER 1: EXECUTION PLANE & REPRODUCIBLE SANDBOX (Z=0) -->
  <g transform="translate(140, 500)">
    <polygon points="120,0 720,0 600,110 0,110" fill="url(#l1Grad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="30" y="30" fill="#fde68a" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">LAYER 1: EXECUTION PLANE &amp; ISOLATED HARNESS (ADR-0001)</text>

    <!-- Node: Docker Sandbox Host -->
    <g transform="translate(40, 46)">
      <rect width="160" height="46" rx="6" fill="url(#nodeGrad)" stroke="#fbbf24" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Ephemeral Docker</text>
      <text x="12" y="37" fill="#fbbf24" font-size="9" font-family="monospace">Per-Trial Fresh Reset</text>
    </g>

    <!-- Node: Independent Ground Truth Evaluator -->
    <g transform="translate(230, 46)">
      <rect width="180" height="46" rx="6" fill="url(#nodeGrad)" stroke="#fbbf24" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Independent Evaluator</text>
      <text x="12" y="37" fill="#f59e0b" font-size="9" font-family="monospace">Read-Only Ground Truth</text>
    </g>

    <!-- Node: Local Inference / OmniRoute -->
    <g transform="translate(440, 46)">
      <rect width="160" height="46" rx="6" fill="url(#nodeGrad)" stroke="#fbbf24" stroke-width="1.2" />
      <text x="12" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Resource / Ollama Shim</text>
      <text x="12" y="37" fill="#d97706" font-size="9" font-family="monospace">RAM Eviction &amp; $0 Inference</text>
    </g>
  </g>

  <!-- Legend & Verification Seal -->
  <g transform="translate(50, 635)">
    <text x="0" y="15" fill="#64748b" font-size="11" font-family="-apple-system, sans-serif">Protocol Invariant: Agent claims never constitute ground truth. Every run verified independently in clean container.</text>
  </g>
</svg>
