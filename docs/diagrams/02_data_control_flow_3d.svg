<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="flowBlockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="flowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1000" height="680" fill="url(#bgGrad2)" rx="16" />

  <!-- Title -->
  <text x="50" y="50" fill="#f8fafc" font-size="22" font-family="-apple-system, sans-serif" font-weight="700">LERM — CORE DATA &amp; CONTROL FLOW</text>
  <text x="50" y="75" fill="#94a3b8" font-size="13" font-family="-apple-system, sans-serif">End-to-End Preregistered Causal Inference Pipeline</text>

  <g transform="translate(60, 110)">
    <!-- STAGE 1: PREREGISTRATION -->
    <g transform="translate(0, 0)" filter="url(#shadow2)">
      <rect width="190" height="110" rx="8" fill="url(#flowBlockGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="190" height="6" rx="3" fill="#38bdf8" />
      <text x="14" y="30" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="700">STAGE 1: DECLARATION</text>
      <text x="14" y="52" fill="#f1f5f9" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">Pre-Registration</text>
      <text x="14" y="72" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Seal Hypothesis &amp; Metrics</text>
      <text x="14" y="88" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• SHA-256 Lock Before Runs</text>
      <text x="14" y="102" fill="#0284c7" font-size="10" font-family="monospace">lerm.prereg.seal()</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 190 55 L 240 55" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="236,50 246,55 236,60" fill="#38bdf8" />

    <!-- STAGE 2: CANDIDATE GENERATION & CALIBRATION -->
    <g transform="translate(245, 0)" filter="url(#shadow2)">
      <rect width="210" height="110" rx="8" fill="url(#flowBlockGrad)" stroke="#06b6d4" stroke-width="1.5" />
      <rect x="0" y="0" width="210" height="6" rx="3" fill="#06b6d4" />
      <text x="14" y="30" fill="#06b6d4" font-size="11" font-family="monospace" font-weight="700">STAGE 2: TASK POOL</text>
      <text x="14" y="52" fill="#f1f5f9" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">SWE-smith &amp; Calibration</text>
      <text x="14" y="72" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Procedural AST Mutations</text>
      <text x="14" y="88" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Guardband 0.35 &lt;= p &lt;= 0.65</text>
      <text x="14" y="102" fill="#0891b2" font-size="10" font-family="monospace">No Treatment Feedback</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 455 55 L 505 55" stroke="#06b6d4" stroke-width="2.5" />
    <polygon points="501,50 511,55 501,60" fill="#06b6d4" />

    <!-- STAGE 3: FIREWALL VERIFICATION -->
    <g transform="translate(510, 0)" filter="url(#shadow2)">
      <rect width="190" height="110" rx="8" fill="url(#flowBlockGrad)" stroke="#ef4444" stroke-width="1.5" />
      <rect x="0" y="0" width="190" height="6" rx="3" fill="#ef4444" />
      <text x="14" y="30" fill="#ef4444" font-size="11" font-family="monospace" font-weight="700">GATE: ISOLATION</text>
      <text x="14" y="52" fill="#f1f5f9" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">Fail-Closed Firewall</text>
      <text x="14" y="72" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Blocks HOLDOUT-001..004</text>
      <text x="14" y="88" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Fixture Hash Matching</text>
      <text x="14" y="102" fill="#dc2626" font-size="10" font-family="monospace">lerm.firewall.validate()</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 700 55 L 750 55" stroke="#ef4444" stroke-width="2.5" />
    <polygon points="746,50 756,55 746,60" fill="#ef4444" />

    <!-- STAGE 4: CAUSAL TRIAL RUNNER -->
    <g transform="translate(755, 0)" filter="url(#shadow2)">
      <rect width="180" height="110" rx="8" fill="url(#flowBlockGrad)" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="180" height="6" rx="3" fill="#10b981" />
      <text x="14" y="30" fill="#10b981" font-size="11" font-family="monospace" font-weight="700">STAGE 3: EXECUTION</text>
      <text x="14" y="52" fill="#f1f5f9" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">Matched Trial Arms</text>
      <text x="14" y="72" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Arm A: loop_retry</text>
      <text x="14" y="88" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Arm B: loop_verify</text>
      <text x="14" y="102" fill="#059669" font-size="10" font-family="monospace">Equal Tokens &amp; Clock</text>
    </g>

    <!-- Downward Pipe from Stage 4 to Middle Execution Layer -->
    <path d="M 845 110 L 845 180 L 100 180 L 100 230" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" fill="none" />
    <polygon points="96,226 100,234 104,226" fill="#10b981" />

    <!-- MIDDLE ROW: DOCKER HARNESS & EVALUATION -->
    <g transform="translate(0, 235)" filter="url(#shadow2)">
      <rect width="440" height="140" rx="8" fill="url(#flowBlockGrad)" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="0" y="0" width="440" height="6" rx="3" fill="#f59e0b" />
      <text x="16" y="30" fill="#f59e0b" font-size="11" font-family="monospace" font-weight="700">CONTAINERIZED EPHEMERAL EXECUTION (ADR-0001)</text>
      <text x="16" y="54" fill="#f1f5f9" font-size="15" font-family="-apple-system, sans-serif" font-weight="700">Fresh Sandbox &amp; Ground-Truth Verification</text>
      
      <g transform="translate(16, 68)">
        <rect width="190" height="52" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="10" y="20" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Per-Trial Container Reset</text>
        <text x="10" y="36" fill="#64748b" font-size="10" font-family="monospace">Fixture Hash Pre-Flight Check</text>
      </g>

      <g transform="translate(220, 68)">
        <rect width="200" height="52" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="10" y="20" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Independent Pytest Evaluator</text>
        <text x="10" y="36" fill="#64748b" font-size="10" font-family="monospace">Zero Agent Output Ingestion</text>
      </g>
    </g>

    <!-- Arrow Middle Left -> Middle Right -->
    <path d="M 440 305 L 510 305" stroke="#f59e0b" stroke-width="2.5" />
    <polygon points="506,300 516,305 506,310" fill="#f59e0b" />

    <!-- MIDDLE RIGHT: L1 TRACE & TELEMETRY -->
    <g transform="translate(515, 235)" filter="url(#shadow2)">
      <rect width="420" height="140" rx="8" fill="url(#flowBlockGrad)" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="420" height="6" rx="3" fill="#10b981" />
      <text x="16" y="30" fill="#10b981" font-size="11" font-family="monospace" font-weight="700">L1 TRACE &amp; TELEMETRY LAYER</text>
      <text x="16" y="54" fill="#f1f5f9" font-size="15" font-family="-apple-system, sans-serif" font-weight="700">Immutable JSONL Metric Extraction</text>

      <g transform="translate(16, 68)">
        <rect width="180" height="52" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="10" y="20" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">3 Unmerged Outcomes</text>
        <text x="10" y="36" fill="#64748b" font-size="10" font-family="monospace">Success / Infra / Model</text>
      </g>

      <g transform="translate(210, 68)">
        <rect width="190" height="52" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="10" y="20" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Overhead Budgeting</text>
        <text x="10" y="36" fill="#64748b" font-size="10" font-family="monospace">LERM Overhead &lt;= 10%</text>
      </g>
    </g>

    <!-- Downward Pipe to Analysis Layer -->
    <path d="M 725 375 L 725 435" stroke="#10b981" stroke-width="2.5" />
    <polygon points="721,431 725,439 729,431" fill="#10b981" />

    <!-- BOTTOM ROW: CONFOUNDS, SKEPTIC & KNOWLEDGE BASE -->
    <g transform="translate(0, 440)" filter="url(#shadow2)">
      <!-- Box 1: Confound Balancing & Pass^k -->
      <g transform="translate(0, 0)">
        <rect width="310" height="135" rx="8" fill="url(#flowBlockGrad)" stroke="#a855f7" stroke-width="1.5" />
        <rect x="0" y="0" width="310" height="6" rx="3" fill="#a855f7" />
        <text x="14" y="28" fill="#a855f7" font-size="11" font-family="monospace" font-weight="700">CONFOUND AUDITOR &amp; STATS</text>
        <text x="14" y="50" fill="#f1f5f9" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">10-Confound Checklist</text>
        <text x="14" y="70" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Token / Clock / Step Equality</text>
        <text x="14" y="86" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• Pass^k Unbiased Combinatorial Est</text>
        <text x="14" y="104" fill="#c084fc" font-size="10" font-family="monospace">Causal Eligibility Gate</text>
      </g>

      <!-- Arrow -->
      <path d="M 310 67 L 350 67" stroke="#a855f7" stroke-width="2.5" />
      <polygon points="346,62 356,67 346,72" fill="#a855f7" />

      <!-- Box 2: Adversarial Skeptic Attack -->
      <g transform="translate(355, 0)">
        <rect width="300" height="135" rx="8" fill="url(#flowBlockGrad)" stroke="#ec4899" stroke-width="1.5" />
        <rect x="0" y="0" width="300" height="6" rx="3" fill="#ec4899" />
        <text x="14" y="28" fill="#ec4899" font-size="11" font-family="monospace" font-weight="700">ADVERSARIAL SKEPTIC (L0)</text>
        <text x="14" y="50" fill="#f1f5f9" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">5-Attack Verification</text>
        <text x="14" y="70" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• 1. Fresh Seeds Replication</text>
        <text x="14" y="86" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• 2. Confound / 3. Shortcut Hunt</text>
        <text x="14" y="104" fill="#f472b6" font-size="10" font-family="monospace">Different Model Family Required</text>
      </g>

      <!-- Arrow -->
      <path d="M 655 67 L 695 67" stroke="#ec4899" stroke-width="2.5" />
      <polygon points="691,62 701,67 691,72" fill="#ec4899" />

      <!-- Box 3: Knowledge Base & Settlement -->
      <g transform="translate(700, 0)">
        <rect width="235" height="135" rx="8" fill="url(#flowBlockGrad)" stroke="#10b981" stroke-width="1.5" />
        <rect x="0" y="0" width="235" height="6" rx="3" fill="#10b981" />
        <text x="14" y="28" fill="#10b981" font-size="11" font-family="monospace" font-weight="700">SCIENTIFIC SETTLEMENT</text>
        <text x="14" y="50" fill="#f1f5f9" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">Knowledge Base (KB)</text>
        <text x="14" y="70" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">• 3 Values: SUPPORTED /</text>
        <text x="14" y="86" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">  REFUTED / UNCERTAIN</text>
        <text x="14" y="104" fill="#34d399" font-size="10" font-family="monospace">Mandatory 'unexplained' Field</text>
      </g>
    </g>
  </g>
</svg>
