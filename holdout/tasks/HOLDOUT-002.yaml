        with open("config/tenant_manifest.json", "w") as f:
            json.dump(data, f, indent=2)
        print("Schema upgraded to version 2.")
    - path: "scripts/verify_tenant_state.py"
      content: |
        import argparse
        import json
        import sys
        from pathlib import Path

        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument("--expected", required=True)
            parser.add_argument("--strict", action="store_true")
            args = parser.parse_args()

            cfg = Path("config/tenant_manifest.json")
            if not cfg.exists():
                print("FAIL: config/tenant_manifest.json not found", file=sys.stderr)
                sys.exit(1)

            try:
                data = json.loads(cfg.read_text())
            except Exception as ex:
                print(f"FAIL: invalid json: {ex}", file=sys.stderr)
                sys.exit(1)

            if data.get("tenant_id") != args.expected:
                print(f"FAIL: expected tenant_id {args.expected}, got {data.get('tenant_id')}", file=sys.stderr)
                sys.exit(1)

            if args.strict and data.get("isolation") != "strict":
                print(f"FAIL: strict isolation violated, got {data.get('isolation')}", file=sys.stderr)
                sys.exit(1)

            if data.get("schema_version", 1) < 2:
                print(f"FAIL: schema not upgraded (version {data.get('schema_version')})", file=sys.stderr)
                sys.exit(1)

            print(f"PASS: tenant state verified for {args.expected} (strict={args.strict}, version={data.get('schema_version')})")
            sys.exit(0)

        if __name__ == "__main__":
            main()
